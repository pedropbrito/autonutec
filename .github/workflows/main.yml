name: Monitoramento TCE-CE
on:
  schedule:
    - cron: '0 11 * * 1-5' # Roda de seg a sex, às 08h00 (horário de Brasília) - UTC-3
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  buscar-diario:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar Robô
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
        run: python main.py
