name: Monitoramento TCE-CE
on:
  schedule:
    - cron: '0 12 * * 1-5' # Roda de seg a sex, às 09h00 (horário de Brasília) - UTC-3
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  buscar-diario:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar Robô
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
        run: python main.py